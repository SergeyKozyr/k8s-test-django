apiVersion: v1
kind: ConfigMap
metadata:
  name: main-nginx-config
data:
  nginx.conf: |
    user nginx;
    worker_processes  2;

    http {
      upstream backend {
        server djangoapp.edu-sergej-kozyr.svc.cluster.local:8080;
      }

      server {
        listen       80;
        server_name  edu-sergej-kozyr.yc-sirius-dev.pelid.team;
        location / {
          proxy_pass http://backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }

    events {}